version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - backend_data:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - frontend_data:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: mysql:8
    environment:
      - MYSQL_ROOT_PASSWORD=Queen369963
      - MYSQL_DATABASE=ReviewApp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql_data:
  backend_data:
  frontend_data:

networks:
  app-network:
    driver: bridge
