name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug - List Files
        run: ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # Install Backend Dependencies (if backend exists)
      - name: Install Backend Dependencies
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm install
            npm install eslint --save-dev
          else
            echo "Backend folder not found! Skipping..."
          fi

      # Install Frontend Dependencies (if frontend exists)
      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install
          else
            echo "Frontend folder not found! Skipping..."
          fi

      # Cache Backend Dependencies (only if backend exists)
      - name: Cache Backend Dependencies
        if: hashFiles('backend/package-lock.json') != ''
        uses: actions/cache@v3
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      # Cache Frontend Dependencies (only if frontend exists)
      - name: Cache Frontend Dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # Run Backend Tests (if backend exists)
      - name: Run Backend Tests
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm run test
          else
            echo "Backend folder not found! Skipping tests..."
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_db

      # Run Backend Linting (if backend exists)
      - name: Run Backend Linting
        run: |
          if [ -d "backend" ]; then
            cd backend
            npx eslint .
          else
            echo "Backend folder not found! Skipping linting..."
          fi

      # Run Frontend Tests (if frontend exists)
      - name: Run Frontend Tests
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run test
          else
            echo "Frontend folder not found! Skipping tests..."
          fi

      # Run Frontend Type Check (if frontend exists)
      - name: Run Frontend Type Check
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run typescript:check
          else
            echo "Frontend folder not found! Skipping type checking..."
          fi

      # Run Frontend Linting (if frontend exists)
      - name: Run Frontend Linting
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run lint
          else
            echo "Frontend folder not found! Skipping linting..."
          fi

      # Build Backend (if backend exists)
      - name: Build Backend
        run: |
          if [ -d "backend" ]; then
            cd backend
            npm run build
          else
            echo "Backend folder not found! Skipping build..."
          fi

      # Build Frontend (if frontend exists)
      - name: Build Frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm run build
          else
            echo "Frontend folder not found! Skipping build..."
          fi

      # Cache build artifacts (only if they exist)
      - name: Cache Build Artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/dist
            backend/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Build Artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/dist
            backend/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # Add your deployment steps here based on your hosting platform
        env:
          NODE_ENV: production