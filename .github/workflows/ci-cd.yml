name: Debug CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  debug-structure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: List directory contents
        run: ls -R

      - name: Verify backend directory
        run: |
          if [ -d "backend" ]; then
            echo "Backend directory exists."
            ls -R backend
          else
            echo "Backend directory does not exist."
          fi

      - name: Verify frontend directory
        run: |
          if [ -d "frontend" ]; then
            echo "Frontend directory exists."
            ls -R frontend
          else
            echo "Frontend directory does not exist."
          fi
