name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Install dependencies before setting up Node.js to ensure lock files are present
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm install
          npm install eslint --save-dev

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # Now set up Node.js with the lock files in place
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Setup Node.js for Frontend
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: test_db

      - name: Run Backend Linting
        working-directory: ./backend
        run: npx eslint .

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test

      - name: Run Frontend Type Check
        working-directory: ./frontend
        run: npm run typescript:check

      - name: Run Frontend Linting
        working-directory: ./frontend
        run: npm run lint

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/dist
            backend/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/cache@v3
        with:
          path: |
            frontend/dist
            backend/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment steps here based on your hosting platform
        env:
          # Add any necessary deployment credentials/tokens here
          NODE_ENV: production